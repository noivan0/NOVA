# NOVA Kernel — Domain Interrupt Routing Configuration (example)
# =====================================================
#
# Replace this file to adapt NOVA's Semantic Interrupt Scheduler to your
# own organization / project. The core (interrupt.py) contains zero
# organization-specific logic — everything domain-specific lives here.
#
# Structure:
#   domains.<slug>:
#     description  : domain description (used in logs/debugging)
#     keywords     : keyword groups (list[list[str]])
#                    matches if ANY keyword within a group appears in the claim
#     harness      : harness name to trigger
#     cooldown_min : cooldown in minutes before the same harness can re-trigger
#     min_matches  : minimum number of matching takes required to trigger
#
#   defaults:
#     fallback_harness      : default harness when no domain matches
#     fallback_cooldown_min : cooldown (minutes) for the fallback harness
#     fallback_min_takes    : minimum accumulated takes to trigger the
#                              SYNTHESIZE fallback
#
# NOTE for private/enterprise deployments:
# Keep your real domain keywords, internal project codenames, and process
# names out of version control. Copy this file to a path outside the repo
# (or to a git-ignored local override) and point NOVA at it via
#   NOVA_DOMAIN_ROUTING_YAML=/path/to/your/domain_routing.yaml
# or by passing routing_yaml= directly to InterruptRouter().

domains:

  # Example: a manufacturing/ops monitoring domain.
  example_ops_monitoring:
    description: "Example: production line / equipment monitoring domain"
    keywords:
      - ["cycle time", "throughput", "downtime"]
      - ["equipment", "line", "process anomaly"]
      - ["monitoring", "dashboard", "alert threshold"]
    harness: research
    cooldown_min: 60
    min_matches: 2

  # Example: a project-specific research domain (rename/replace for your team).
  example_project_research:
    description: "Example: dedicated research domain for a specific project"
    keywords:
      - ["project-x", "tool inventory", "asset tracking"]
      - ["deployment", "rollout"]
    harness: research
    cooldown_min: 120
    min_matches: 2

  system:
    description: "System / bug self-healing — error patterns, bug fixes"
    keywords:
      - ["BUG", "bug", "error", "Error", "FAIL"]
      - ["fix needed", "traceback", "exception", "failure"]
      - ["crash", "hang", "abnormal"]
    harness: investigate  # SELF_HEAL dedicated investigate harness
    cooldown_min: 30      # short cooldown — urgency is high
    min_matches: 3        # trigger once 3+ error-pattern takes accumulate

  security_review:
    description: "Security audit — CSO review + STRIDE threat modeling"
    keywords:
      - ["STRIDE", "threat model", "OWASP"]
      - ["vulnerability", "injection", "XSS", "CSRF", "auth failure"]
      - ["LLM trust boundary", "prompt injection", "privilege escalation"]
    harness: security_sign_off
    cooldown_min: 60
    min_matches: 2

  root_cause:
    description: "Root-cause analysis — investigate + systematic debugging"
    keywords:
      - ["root cause", "5 whys", "reproduction", "repro"]
      - ["why did this happen", "recurring error", "persistent failure"]
      - ["fresh verification", "unverified completion claim"]
    harness: investigate
    cooldown_min: 45
    min_matches: 2

defaults:
  fallback_harness: research        # default harness when no domain matches
  fallback_cooldown_min: 20         # default cooldown (minutes) for the fallback
  fallback_min_takes: 20            # min accumulated takes to trigger SYNTHESIZE fallback
  interrupt_budget: 1               # max interrupts actually dispatched per tick
                                     # (classify_with_budget()) — the rest are
                                     # recorded as "excluded" with an explicit
                                     # reason instead of silently dropped
