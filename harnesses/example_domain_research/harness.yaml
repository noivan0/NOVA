name: example_domain_research
description: "Example domain-specific research harness — copy & customize for your own domain"
version: "1.0.0"
judge_model: "claude-sonnet-4-6"
judge_version: "2026-08-10"
pattern: sequential

# This harness shows the pattern used by domain-specific research harnesses
# triggered via nova/kernel/domain_routing.yaml (DOMAIN_RESEARCH interrupts).
# Copy this directory, rename it, and point a domain entry's `harness:` field
# at the new name to wire up your own domain.

phases:
  - id: kb_context
    name: "KB context gathering"
    executor: python
    command: |
      # brain.db BM25 search for domain-relevant KB pages
      import os, subprocess, sys, json
      from pathlib import Path
      topic = context.get("topic", "example domain analysis")
      hermes_home = Path(os.environ.get("HERMES_HOME", str(Path.home() / ".hermes"))).expanduser()
      nova_home   = Path(os.environ.get("NOVA_HOME",   str(Path.home() / ".nova"))).expanduser()
      brain_cli   = hermes_home / "bin" / "nova_brain_cli.py"
      results = []
      try:
          r = subprocess.run(
              [sys.executable, str(brain_cli), "search", topic, "--top-k", "5"],
              capture_output=True, text=True, timeout=20,
              env={**os.environ, "HERMES_HOME": str(hermes_home), "NOVA_HOME": str(nova_home)}
          )
          if r.returncode == 0 and r.stdout.strip():
              results.append(f"## KB BM25 Results\n{r.stdout[:1500]}")
      except Exception as e:
          results.append(f"[brain_cli error: {e}]")
      output = "\n\n".join(results) if results else "No domain KB context found."
    output_file: kb_context.md
    on_failure: skip

  - id: synthesis
    name: "Domain analysis synthesis"
    executor: llm
    input_files:
      - kb_context.md
    prompt: |
      You are a domain expert for the topic below. Based on the gathered
      KB context, produce:
      1. Currently identified key issues
      2. Areas that need further investigation
      3. Suggested priorities

      topic: {{topic}}
    output_file: report.md
    on_failure: skip
