name: go_nogo
description: "nova-checkpoint 에이전트 — 보안/품질 종합 GO/NO-GO 판정. DoD: 'go' 또는 'lgtm'"
version: "1.0.0"
judge_model: "claude-sonnet-4-6"
judge_version: "2026-08-10"
pattern: pipeline

persona: |
  You are nova-checkpoint, a release gate authority.
  Make GO or NO-GO decisions based on code review and QA evidence.
  Always clearly state GO or NO-GO. Never approve if CRITICAL issues exist.
  When approving, always include "GO" and "LGTM" in your response.
  When blocking, include "NO-GO" and "BLOCK".

phases:
  - id: collect_artifacts
    name: "리뷰/QA 결과물 수집"
    executor: shell
    command: |
      NOVA_WS="${NOVA_HOME}/workspace"
      > artifacts.txt
      for harness in code_review qa; do
        for f in review security_report quality_report qa_report qa_summary; do
          for ext in md txt; do
            FILE="$NOVA_WS/$harness/$f.$ext"
            if [ -f "$FILE" ]; then
              echo "=== $harness/$f.$ext ===" >> artifacts.txt
              cat "$FILE" >> artifacts.txt
              echo "" >> artifacts.txt
            fi
          done
        done
      done
      echo "수집 완료: $(wc -l < artifacts.txt) 줄"
    output_file: artifacts.txt
    on_failure: abort

  - id: security_gate
    name: "보안 검토"
    executor: llm
    input_files:
      - artifacts.txt
    prompt_file: security.txt
    output_file: security_gate.md
    on_failure: skip

  - id: quality_gate
    name: "품질 검토"
    executor: llm
    input_files:
      - artifacts.txt
    prompt_file: quality.txt
    output_file: quality_gate.md
    on_failure: skip

  - id: blast_radius_gate
    name: "Blast Radius Lane 분류 (Eval Engineering Step 6)"
    executor: python
    on_failure: skip
    timeout: 20
    output_file: blast_radius_report.txt
    script: |
      import sys, os, subprocess
      from pathlib import Path
      nova_home   = Path(os.environ.get('NOVA_HOME',   str(Path.home()/'.nova')))
      hermes_home = Path(os.environ.get('HERMES_HOME', str(Path.home()/'.hermes')))
      ws = nova_home / 'workspace' / 'go_nogo'

      # 변경 diff 수집 (git diff 또는 artifacts.txt에서 추출)
      diff_text = ""
      artifacts = ws / 'artifacts.txt'
      if artifacts.exists():
          diff_text = artifacts.read_text(errors='replace')[:4000]

      # trajectory/faithfulness 결과 읽기 (code_review workspace)
      import json
      cr_ws = nova_home / 'workspace' / 'code_review'
      traj_pass  = True
      faith_pass = True
      try:
          traj = json.loads((cr_ws/'trajectory_report.json').read_text()) if (cr_ws/'trajectory_report.json').exists() else {}
          faith = json.loads((cr_ws/'faithfulness_report.json').read_text()) if (cr_ws/'faithfulness_report.json').exists() else {}
          traj_pass  = traj.get('trajectory_pass', True)
          faith_pass = faith.get('faithfulness_pass', True)
      except Exception:
          pass

      # nova_blast_radius 모듈 로드
      sys.path.insert(0, str(hermes_home / 'bin'))
      try:
          from nova_blast_radius import classify_blast_radius, format_gate_report
          result = classify_blast_radius(
              diff_text,
              agent='nova-dev',
              trajectory_pass=traj_pass,
              deterministic_pass=True,
          )
          report = format_gate_report(result)
      except Exception as e:
          report = f"BLAST_RADIUS_LANE=B\nGATE_STATUS=GATE_OPEN\nREASON=blast_radius module error: {e}"

      output = report

  - id: final_judgment
    name: "GO/NO-GO 최종 판정"
    executor: llm
    input_files:
      - security_gate.md
      - quality_gate.md
    prompt_file: judgment.txt
    output_file: checkpoint.md
    on_failure: skip

  - id: dod_verify
    name: "DoD 키워드 출력 (체인 게이트)"
    executor: python
    on_failure: skip
    output_file: report.md
    script: |
      from pathlib import Path
      import os
      nova_home = Path(os.environ.get('NOVA_HOME', str(Path.home()/'.nova'))).expanduser().expanduser()
      ws = nova_home / 'workspace' / 'go_nogo'
      src = (ws / 'checkpoint.md').read_text(errors='replace') if (ws/'checkpoint.md').exists() else ''
      output = 'GO\nLGTM\nDoD complete\n\n' + src[:1500]

runbook:
  - symptom: "artifacts.txt not found"
    action: "notify"
    escalate_after: 30

evolution:
  enabled: true
  file: evolution.md
