name: nuuseta_research
description: "누우+세타III 블록라인 프로젝트 심층 리서치"
version: "1.0.0"
pattern: sequential

phases:
  - id: kb_context
    name: "누우+세타 KB 컨텍스트 수집"
    executor: python
    command: |
      import os, subprocess, sys
      from pathlib import Path
      topic = context.get("topic", "누우 세타III 공구 툴리스트 분석")
      hermes_home = Path(os.environ.get("HERMES_HOME", str(Path.home() / ".hermes"))).expanduser()
      nova_home   = Path(os.environ.get("NOVA_HOME",   str(Path.home() / ".nova"))).expanduser()
      brain_cli   = hermes_home / "bin" / "nova_brain_cli.py"
      results = []
      try:
          r = subprocess.run(
              [sys.executable, str(brain_cli), "search", topic, "--top-k", "5"],
              capture_output=True, text=True, timeout=20,
              env={**os.environ, "HERMES_HOME": str(hermes_home), "NOVA_HOME": str(nova_home)}
          )
          if r.returncode == 0 and r.stdout.strip():
              results.append(f"## KB BM25 Results\n{r.stdout[:1500]}")
      except Exception as e:
          results.append(f"[brain_cli 오류: {e}]")
      # 누우세타 KB 파일 직접 검색
      kb_path = hermes_home / "kb"
      if kb_path.exists():
          kw = ["누우", "NUBL", "툴리스트", "세타III", "공구"]
          for md in list(kb_path.rglob("*.md"))[:50]:
              try:
                  md_text = md.read_text(errors="ignore")
                  if any(k in md_text for k in kw):
                      results.append(f"## {md.name}\n{md_text[:800]}")
              except Exception:
                  pass
          results = results[:5]
      output = "\n\n".join(results) if results else "No nuuseta KB context."
    output_file: kb_context.md
    on_failure: skip

  - id: synthesis
    name: "누우+세타III 분석"
    executor: llm
    input_files:
      - kb_context.md
    prompt: |
      당신은 누우+세타III 블록라인 전문가입니다.
      KB 컨텍스트 기반 주요 이슈와 우선 조사 필요 영역 제안.

      topic: {{topic}}
    output_file: report.md
    on_failure: skip
