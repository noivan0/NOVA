name: kpi_evaluate
description: "nova-evaluator — brain_health KPI 평가. Deterministic-First 게이트 + 3-Judge 패널(Planner/Critic/Architect) 합의. DoD: KPI_PASS 또는 KPI_FAIL 출력"
version: "1.1.0"
judge_model: "claude-sonnet-4-6"
judge_version: "2026-08-10"
panel_judges:
  - model: "claude-sonnet-4-6"
    provider: anthropic
    role: "planner"
    version: "2026-08-10"
  - model: "gpt-5.4"
    provider: codex
    role: "critic"
    version: "2026-08-10"
  - model: "claude-sonnet-4-6"
    provider: anthropic
    role: "architect"
    version: "2026-08-10"
pattern: pipeline

persona: |
  You are nova-evaluator. Measure KPI objectively.
  Always state KPI_PASS or KPI_FAIL clearly in your output.

phases:
  - id: deterministic_gate
    name: "Deterministic 선검증 (LLM 없이)"
    executor: python
    on_failure: skip
    timeout: 20
    output_file: deterministic_check.json
    command: |
      import sqlite3, json, os, time
      from pathlib import Path
      from datetime import datetime, timezone
      nova_home = Path(os.environ.get("NOVA_HOME", Path.home() / ".nova"))
      hermes_home = Path(os.environ.get("HERMES_HOME", Path.home() / ".hermes"))
      checks = {}
      # 1. takes +3 증가 확인 (직전 health 대비)
      try:
          conn = sqlite3.connect(str(nova_home / "brain.db"), timeout=5)
          takes_now = conn.execute("SELECT count(*) FROM takes").fetchone()[0]
          last_takes = conn.execute("SELECT takes_total FROM brain_health ORDER BY rowid DESC LIMIT 1 OFFSET 1").fetchone()
          prev = last_takes[0] if last_takes else 0
          checks["takes_growth"] = takes_now - prev >= 3
          checks["takes_now"] = takes_now
          conn.close()
      except Exception as e:
          checks["takes_growth"] = False
          checks["takes_error"] = str(e)
      # 2. brain_watcher pid 파일 존재
      pid_path = nova_home / "brain_watcher.pid"
      if pid_path.exists():
          pid = int(pid_path.read_text().strip())
          import subprocess
          r = subprocess.run(["kill", "-0", str(pid)], capture_output=True)
          checks["brain_watcher_alive"] = r.returncode == 0
      else:
          checks["brain_watcher_alive"] = False
      # 3. KB index.md 오늘 날짜 갱신 확인
      today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
      idx = hermes_home / "kb" / "index.md"
      if idx.exists():
          import time as _t
          mtime = _t.strftime("%Y-%m-%d", _t.localtime(idx.stat().st_mtime))
          checks["index_fresh"] = mtime == today
      else:
          checks["index_fresh"] = False
      # 판정: 3개 중 2개 이상 PASS
      passed = sum(1 for k, v in checks.items() if isinstance(v, bool) and v)
      total_bool = sum(1 for v in checks.values() if isinstance(v, bool))
      checks["deterministic_pass"] = passed >= 2
      checks["judge_model"] = "gpt-5.4"
      output = json.dumps(checks, ensure_ascii=False, indent=2)

  - id: collect_kpi_metrics
    name: "KPI 지표 수집"
    executor: python
    command: |
      import sqlite3, json, os
      from pathlib import Path
      nova_home = Path(os.environ.get("NOVA_HOME", Path.home() / ".nova"))
      brain_db = nova_home / "brain.db"
      metrics = {}
      try:
          conn = sqlite3.connect(str(brain_db), timeout=5)
          row = conn.execute(
              "SELECT score_overall, score_coverage, score_depth FROM brain_health ORDER BY rowid DESC LIMIT 1"
          ).fetchone()
          if row:
              metrics["score_overall"]  = row[0]
              metrics["score_coverage"] = row[1]
              metrics["score_depth"]    = row[2]
          metrics["takes"] = conn.execute("SELECT count(*) FROM takes").fetchone()[0]
          try:
              metrics["open_contradictions"] = conn.execute(
                  "SELECT count(*) FROM contradictions WHERE status='open'"
              ).fetchone()[0]
          except Exception:
              metrics["open_contradictions"] = 0
          conn.close()
      except Exception as e:
          metrics["error"] = str(e)
      output = json.dumps(metrics, ensure_ascii=False, indent=2)
    output_file: kpi_raw.json
    timeout: 30
    on_failure: abort

  - id: evaluate_kpi
    name: "KPI LLM 평가 (Claude — 1차)"
    executor: llm
    input_files:
      - kpi_raw.json
    prompt_file: evaluate.txt
    output_file: kpi_report_claude.md
    timeout: 60
    on_failure: skip
    provider: anthropic
    judge_model: "claude-sonnet-4-6"
    judge_version: "2026-08-10"

  - id: evaluate_kpi_codex
    name: "KPI 패널 Judge (Codex GPT-5.4 — 2차, cross-family)"
    executor: llm
    input_files:
      - kpi_raw.json
    prompt_file: evaluate.txt
    output_file: kpi_report_codex.md
    timeout: 60
    on_failure: skip
    provider: codex
    judge_model: "gpt-5.4"
    judge_version: "2026-08-10"

  - id: evaluate_kpi_architect
    name: "KPI 패널 Judge (3번째 — Architect 역할, 반대의견 탐색)"
    executor: llm
    input_files:
      - kpi_raw.json
    prompt_file: evaluate_architect.txt
    output_file: kpi_report_architect.md
    timeout: 60
    on_failure: skip
    provider: anthropic
    judge_model: "claude-sonnet-4-6"
    judge_version: "2026-08-10"

  - id: panel_verdict
    name: "패널 Judge 합의 판정 (Deterministic-First + 3-Judge 합의)"
    executor: python
    on_failure: skip
    timeout: 20
    output_file: kpi_panel_verdict.json
    script: |
      import json, re, os
      from pathlib import Path
      nova_home = Path(os.environ.get('NOVA_HOME', str(Path.home()/'.nova')))
      ws = nova_home / 'workspace' / 'kpi_evaluate'

      # ── Deterministic-First: LLM 판정보다 먼저, 하드 게이트로 적용 ──
      # deterministic_gate가 FAIL이면 LLM judge 투표 결과와 무관하게
      # 즉시 KPI_FAIL 확정. "판정 근거 없이 LLM이 낙관적으로 통과시키는"
      # 사례를 원천 차단한다 (oh-my-hermes evidence-boundary 원칙 참고,
      # 2026-08-28 gap 해소).
      det = {}
      det_path = ws / 'deterministic_check.json'
      if det_path.exists():
          try:
              det = json.loads(det_path.read_text(errors='replace'))
          except Exception:
              det = {}
      deterministic_pass = det.get('deterministic_pass', False)

      votes = []
      reasons = []
      for fname, judge in [
          ('kpi_report_claude.md', 'claude'),
          ('kpi_report_codex.md', 'codex'),
          ('kpi_report_architect.md', 'architect'),
      ]:
          fpath = ws / fname
          if fpath.exists():
              text = fpath.read_text(errors='replace')
              if 'KPI_PASS' in text:
                  votes.append(('PASS', judge))
              elif 'KPI_FAIL' in text:
                  votes.append(('FAIL', judge))
              reasons.append({'judge': judge, 'snippet': text[:200]})
      pass_votes = sum(1 for v, _ in votes if v == 'PASS')
      total_votes = len(votes)

      if not deterministic_pass:
          # Deterministic 게이트 실패 — LLM 투표와 무관하게 FAIL 확정
          panel_pass = False
          gate_reason = 'deterministic_gate_failed'
      elif total_votes == 0:
          panel_pass = False
          gate_reason = 'no_judge_votes'
      else:
          # 3 judges: 3/4 합의 원칙 근사 — 2/3 이상 PASS면 통과
          # (기존 2-judge 만장일치 원칙에서 확장: judge 수가 늘어난 만큼
          # 단일 judge 편향에 덜 흔들리도록 과반+1 기준 적용)
          panel_pass = pass_votes >= 2 and (pass_votes / total_votes) >= 0.66
          gate_reason = 'llm_panel_vote'

      verdict = {
          'deterministic_pass': deterministic_pass,
          'deterministic_checks': det,
          'panel_pass': panel_pass,
          'gate_reason': gate_reason,
          'pass_votes': pass_votes,
          'total_votes': total_votes,
          'votes': [{'verdict': v, 'judge': j} for v, j in votes],
          'reasons': reasons,
          'judge_models': [
              'claude-sonnet-4-6@2026-08-10',
              'gpt-5.4@2026-08-10',
              'claude-sonnet-4-6-architect@2026-08-10',
          ],
      }
      output = json.dumps(verdict, ensure_ascii=False, indent=2)

  - id: failure_regression
    name: "실패 회귀 테스트 — failure_to_test 결과 점검"
    executor: python
    on_failure: skip
    timeout: 15
    output_file: failure_regression.json
    command: |
      import json, os
      from pathlib import Path
      hermes_home = Path(os.environ.get("HERMES_HOME", Path.home() / ".hermes"))
      test_dir = hermes_home / "tests" / "failures"
      tests = sorted(test_dir.glob("*.json")) if test_dir.exists() else []
      recent = tests[-20:] if len(tests) > 20 else tests
      persistent = []
      for t in recent:
          try:
              d = json.loads(t.read_text())
              if d.get("worked_or_failed") == "FAILED":
                  persistent.append(d.get("capability_to_protect", t.name))
          except Exception:
              pass
      result = {
          "total_failure_tests": len(tests),
          "checked_recent": len(recent),
          "persistent_failures": len(persistent),
          "samples": persistent[:5],
          "gate": "PASS" if len(persistent) < 5 else "WARN"
      }
      output = json.dumps(result, ensure_ascii=False, indent=2)

  - id: dod_verify
    name: "DoD 키워드 출력 (체인 게이트)"
    executor: python
    on_failure: skip
    output_file: report.md
    script: |
      import json as _j, os
      from pathlib import Path
      nova_home = Path(os.environ.get('NOVA_HOME', str(Path.home()/'.nova'))).expanduser()
      ws = nova_home / 'workspace' / 'kpi_evaluate'
      # 패널 판정 로드
      verdict = {}
      vf = ws / 'kpi_panel_verdict.json'
      if vf.exists():
          verdict = _j.loads(vf.read_text(errors='replace'))
      panel_pass = verdict.get('panel_pass', False)
      deterministic_pass = verdict.get('deterministic_pass', False)
      gate_reason = verdict.get('gate_reason', 'unknown')
      pass_v = verdict.get('pass_votes', 0)
      total_v = verdict.get('total_votes', 0)
      # fallback: kpi_report_claude.md
      src = ''
      for fn in ['kpi_report_claude.md', 'kpi_report_codex.md', 'kpi_report_architect.md']:
          fp = ws / fn
          if fp.exists():
              src += fp.read_text(errors='replace')[:600] + '\n'
      kw = 'KPI_PASS' if panel_pass else 'KPI_FAIL'
      output = (kw + '\n'
          + f'DETERMINISTIC_GATE={"PASS" if deterministic_pass else "FAIL"}\n'
          + f'GATE_REASON={gate_reason}\n'
          + f'PANEL_VERDICT={kw} ({pass_v}/{total_v} judges agree)\n'
          + f'JUDGES=claude-sonnet-4-6@2026-08-10,gpt-5.4@2026-08-10,claude-sonnet-4-6-architect@2026-08-10\n'
          + 'DoD complete\n\n' + src[:1200])

runbook:
  - symptom: "brain.db"
    action: "notify"
    escalate_after: 30

evolution:
  enabled: true
  file: evolution.md
