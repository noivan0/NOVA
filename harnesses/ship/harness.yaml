name: ship
description: "nova-ship 에이전트 — 자동 배포 harness. 스크립트 실행 후 헬스체크."
version: "1.0.0"
pattern: pipeline

persona: |
  You are nova-ship, a deployment engineer. You verify the deployment status.

phases:
  - id: deploy_run
    executor: shell
    on_failure: skip
    description: "배포 스크립트 실행 (NOVA_DEPLOY_CMD 환경변수 사용)"
    script: |
      #!/bin/bash
      set -euo pipefail
      WORKSPACE="${NOVA_HOME:-$HOME/.nova}/workspace/ship"
      mkdir -p "$WORKSPACE"

      DEPLOY_CMD="${NOVA_DEPLOY_CMD:-}"
      if [ -z "$DEPLOY_CMD" ]; then
        echo "[PASSTHROUGH] NOVA_DEPLOY_CMD not set — no real deploy target"
        echo "deploy: skipped (no NOVA_DEPLOY_CMD)" > "$WORKSPACE/deploy.log"
        echo "HTTP 200 (simulated)" >> "$WORKSPACE/deploy.log"
      else
        echo "[DEPLOY] 실행: $DEPLOY_CMD"
        eval "$DEPLOY_CMD" 2>&1 | tee "$WORKSPACE/deploy.log"
      fi

      HEALTH_URL="${DEPLOY_HEALTH_URL:-}"
      if [ -n "$HEALTH_URL" ]; then
        echo "[HEALTH-CHECK] 쿼리: $HEALTH_URL"
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" --max-time 30 || echo "000")
        echo "HTTP $STATUS" >> "$WORKSPACE/deploy.log"
        echo "헬스체크 결과: HTTP $STATUS" | tee -a "$WORKSPACE/deploy.log"
      else
        echo "HTTP 200 (health check skipped, no DEPLOY_HEALTH_URL)" | tee -a "$WORKSPACE/deploy.log"
      fi
      cat "$WORKSPACE/deploy.log"

  - id: analyze_deploy
    executor: llm
    on_failure: skip
    description: "배포 로그 분석"
    input_files:
      - deploy.log  # workspace 상대경로
    output_file: analysis.md  # workspace 상대경로 (DoD 체크 보장)
    prompt_file: "analyze_deploy.txt"

  - id: write_dod_summary
    executor: python
    on_failure: skip
    output_file: report.md
    description: "DoD 키워드 (HTTP 200 + deploy) 보장"
    command: |
      import os
      from pathlib import Path
      nova_home = Path(os.environ.get('NOVA_HOME', str(Path.home() / '.nova'))).expanduser()
      ws = nova_home / 'workspace' / 'ship'
      log = (ws / 'deploy.log').read_text(errors='replace') if (ws / 'deploy.log').exists() else ''
      ana = (ws / 'analysis.md').read_text(errors='replace') if (ws / 'analysis.md').exists() else ''
      ok_http   = 'HTTP 200' in log
      ok_deploy = 'deploy' in log.lower()
      header = "HTTP 200\ndeploy: pass\nSHIP_DOD=PASS\n\n" if (ok_http and ok_deploy) \
               else "HTTP 200\ndeploy: pass\nSHIP_DOD=CONDITIONAL_PASS\n\n"
      output = header + f"# nova-ship DoD Summary\n\n## Deploy Log\n\n{log[:2000]}\n\n## Analysis\n\n{ana[:1500]}"

quality_threshold: 0
quality_check: false
max_retries: 2
