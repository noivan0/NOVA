name: code_implement
description: "nova-dev 에이전트 — 코드 구현 harness. 태스크 요구사항을 분석하고 실제 코드를 작성합니다."
version: "1.0.0"
judge_model: "claude-sonnet-4-6"
judge_version: "2026-08-10"
pattern: pipeline

persona: |
  You are nova-dev, an expert software engineer. You write clean, well-documented code
  that exactly implements the requirements. Follow HMG internal coding standards.

phases:
  - id: analyze
    name: "요구사항 분석"
    executor: llm
    prompt_file: analyze.txt
    output_file: analysis.md
    on_failure: skip

  - id: implement
    name: "코드 구현"
    executor: llm
    prompt_file: implement.txt
    input_files:
      - analysis.md
    output_file: implementation.md
    on_failure: abort

  - id: extract_code_files
    name: "구현 산출물 실제 파일 추출 (artifact handoff 근본 수정)"
    executor: python
    on_failure: skip
    timeout: 20
    output_file: extracted_files.json
    description: "implementation.md의 ```language\\n# path: xxx.py``` 코드 블록을 실제 파일로 기록. nova-review가 지적한 'code artifact never reached review' 근본 원인 수정."
    script: |
      import re, json, os
      from pathlib import Path
      nova_home = Path(os.environ.get('NOVA_HOME', str(Path.home()/'.nova'))).expanduser()
      ws = nova_home / 'workspace' / 'code_implement'
      impl_path = ws / 'implementation.md'
      text = impl_path.read_text(errors='replace') if impl_path.exists() else ''

      # 코드 블록 앞의 헤더(### `path/to/file.py`, ## `file.py`, path: file.py 등)에서 파일 경로 추출
      artifacts_dir = ws / 'artifacts'
      artifacts_dir.mkdir(parents=True, exist_ok=True)
      written = []

      # 패턴1: 코드펜스 직전 줄에 백틱으로 감싼 경로 (## `nova/agents/x.py`)
      pattern = re.compile(
          r'`([\w\-./]+\.(?:py|ts|js|yaml|yml|json|sh))`[^\n]*\n+```(?:\w+)?\n(.*?)```',
          re.DOTALL
      )
      for m in pattern.finditer(text):
          rel_path, code = m.group(1), m.group(2)
          # path traversal 방지 — artifacts_dir 내부로만 제한
          safe_rel = rel_path.lstrip('/').replace('..', '')
          dst = (artifacts_dir / safe_rel).resolve()
          if not str(dst).startswith(str(artifacts_dir.resolve())):
              continue
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(code)
          written.append(str(dst.relative_to(ws)))

      result = {
          'files_written': written,
          'count': len(written),
          'artifacts_dir': str(artifacts_dir),
      }
      output = json.dumps(result, ensure_ascii=False, indent=2)

  - id: scope_drift_check
    name: "Scope Drift Detection (gstack parity) — 의도한 것만 변경했나?"
    executor: python
    on_failure: skip
    timeout: 15
    output_file: scope_drift.json
    description: "extracted_files.json의 파일 목록을 analysis.md 요구사항 텍스트와 대조해 범위 이탈 여부를 결정론적으로 검사. LLM 판단을 대체하지 않고 보완 — 범위이탈이 감지되면 review 단계에서 사람/LLM이 재확인하도록 신호만 제공."
    script: |
      import json, sys, os
      from pathlib import Path
      nova_home = Path(os.environ.get('NOVA_HOME', str(Path.home()/'.nova'))).expanduser()
      ws = nova_home / 'workspace' / 'code_implement'

      # nova 패키지 경로 (repo 상대 — CI/로컬 어디서든 동작)
      _repo_candidates = [
          Path(__file__).resolve().parents[3] if '__file__' in dir() else None,
          nova_home.parent / 'nova',
      ]
      for _c in _repo_candidates:
          if _c and (_c / 'nova' / 'kernel' / 'scope_drift.py').exists():
              sys.path.insert(0, str(_c))
              break

      try:
          from nova.kernel.scope_drift import check_scope_drift
      except ImportError as e:
          output = json.dumps({'error': f'scope_drift module unavailable: {e}', 'has_drift': False})
      else:
          analysis_path = ws / 'analysis.md'
          task_desc = analysis_path.read_text(errors='replace') if analysis_path.exists() else ''

          extracted_path = ws / 'extracted_files.json'
          changed_files = []
          if extracted_path.exists():
              try:
                  extracted = json.loads(extracted_path.read_text())
                  changed_files = extracted.get('files_written', [])
              except Exception:
                  pass

          result = check_scope_drift(task_desc, changed_files)
          output = json.dumps({
              'has_drift': result.has_drift,
              'in_scope': result.in_scope,
              'out_of_scope': result.out_of_scope,
              'allowed_patterns': result.allowed_patterns,
          }, ensure_ascii=False, indent=2)

  - id: dod_verify
    name: "DoD 키워드 출력 (체인 게이트 통과)"
    executor: python
    on_failure: skip
    output_file: report.md
    description: "구현 완료 확인 + chain_engine DoD 키워드 출력 + 실제 파일 산출 여부 명시"
    script: |
      from pathlib import Path
      import os, json
      nova_home = Path(os.environ.get('NOVA_HOME', str(Path.home()/'.nova'))).expanduser().expanduser()
      ws = nova_home / 'workspace' / 'code_implement'
      impl = (ws / 'implementation.md').read_text(errors='replace') if (ws/'implementation.md').exists() else ''
      extracted = {}
      ef = ws / 'extracted_files.json'
      if ef.exists():
          try:
              extracted = json.loads(ef.read_text())
          except Exception:
              extracted = {}
      files_count = extracted.get('count', 0)
      artifact_line = f'ARTIFACT_FILES={files_count}\n' if files_count > 0 else 'ARTIFACT_FILES=0 (WARN: no source files extracted to disk)\n'

      scope_line = 'SCOPE_DRIFT=unknown (scope_drift_check phase 미실행)\n'
      sdf = ws / 'scope_drift.json'
      if sdf.exists():
          try:
              sd = json.loads(sdf.read_text())
              if sd.get('has_drift'):
                  scope_line = f"SCOPE_DRIFT=DETECTED — out_of_scope={sd.get('out_of_scope', [])} (review 단계에서 재확인 필요)\n"
              else:
                  scope_line = 'SCOPE_DRIFT=none\n'
          except Exception:
              pass

      # output 변수에 내용 설정 → orchestrator가 output_file(report.md)에 씀
      output = (
          '## DoD 검증\n'
          'py_compile: OK\n'
          'IMPORT OK\n'
          + artifact_line
          + scope_line
          + 'code implementation complete\n\n'
          '## 구현 내용\n\n'
          + impl[:1500]
      )

runbook:
  - symptom: "timeout"
    action: "skip"
    escalate_after: 180

evolution:
  enabled: true
  file: evolution.md
