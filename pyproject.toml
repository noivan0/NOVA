[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nova-orchestrator"
version = "1.0.0"
description = "NOVA — Noivan Orchestrated Vanguard Architecture: Single-agent AI orchestration framework"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "noivan", email = "noivan0@github.com" }]
requires-python = ">=3.10"
keywords = ["ai", "orchestration", "harness", "llm", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
ollama = []          # Uses built-in urllib — no extra deps
all = ["openai>=1.0", "anthropic>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "openai>=1.0",
    "anthropic>=0.20",
    "black",
    "ruff",
    "mypy",
]

[project.scripts]
nova = "nova.cli.main:main"

[project.urls]
Homepage = "https://github.com/noivan0/NOVA"
Repository = "https://github.com/noivan0/NOVA"
Issues = "https://github.com/noivan0/NOVA/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["nova*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
